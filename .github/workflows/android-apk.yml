name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: '빌드할 APK 종류 (debug / release / both)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both

permissions:
  contents: read

jobs:
  build-apk:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager")"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore
          else
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Check build mode and release secrets
        id: build_config
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          REQUESTED_TYPE: ${{ inputs.build_type || 'both' }}
        run: |
          BUILD_DEBUG="false"
          BUILD_RELEASE="false"

          if [ "$REQUESTED_TYPE" = "debug" ] || [ "$REQUESTED_TYPE" = "both" ]; then
            BUILD_DEBUG="true"
          fi

          HAS_SECRETS="false"
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            HAS_SECRETS="true"
          fi

          if [ "$REQUESTED_TYPE" = "release" ]; then
            if [ "$HAS_SECRETS" != "true" ]; then
              echo "::error::Release APK 빌드를 위해 GitHub Secrets(RELEASE_KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD)를 먼저 등록해 주세요."
              exit 1
            fi
            BUILD_RELEASE="true"
          elif [ "$REQUESTED_TYPE" = "both" ] && [ "$HAS_SECRETS" = "true" ]; then
            BUILD_RELEASE="true"
          elif [ "$REQUESTED_TYPE" = "both" ]; then
            echo "::notice::Release 서명 시크릿이 아직 없어 Debug APK만 빌드합니다."
          fi

          echo "build_debug=$BUILD_DEBUG" >> "$GITHUB_OUTPUT"
          echo "build_release=$BUILD_RELEASE" >> "$GITHUB_OUTPUT"

      - name: Build Debug APK
        if: steps.build_config.outputs.build_debug == 'true'
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload Debug APK artifact
        if: steps.build_config.outputs.build_debug == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: senior-health-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Decode release keystore
        if: steps.build_config.outputs.build_release == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "${{ github.workspace }}/my-upload-key.jks"

      - name: Build Release APK
        if: steps.build_config.outputs.build_release == 'true'
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Remove temporary release keystore
        if: always() && steps.build_config.outputs.build_release == 'true'
        run: rm -f "${{ github.workspace }}/my-upload-key.jks"

      - name: Upload Release APK artifact
        if: steps.build_config.outputs.build_release == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: senior-health-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error
